<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<title>D4 — Progreso del alumno</title>
<script src="4525c7f3-9641-40c6-95c4-819f723a0607"></script>
</head>
<body>
<x-dc>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #111214; color: #F2F2EE; font-family: 'Geist', 'Helvetica Neue', sans-serif; padding: 58px 16px 0; display: flex; flex-direction: column; gap: 12px">

  <header style="display: flex; align-items: center; gap: 12px">
    <a href="D3_Perfil.dc.html" aria-label="Volver al perfil" style="width: 44px; height: 44px; border-radius: 50%; background: #1C1D21; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#F2F2EE" stroke-width="2.2"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; flex-direction: column; flex: 1">
      <span style="font-size: 13px; color: #9A9DA5">Progreso</span>
      <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em">Lucas Ferreyra</span>
    </div>
    <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #3A3C42; background: transparent; color: #F2F2EE; font-family: inherit; font-size: 13px; font-weight: 600">Últimos 3 meses</button>
  </header>

  <!-- Comparar -->
  <section style="background: #1C1D21; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 4px; background: #111214; border-radius: 18px; padding: 3px">
      <sc-for list="{{ modes }}" as="m" hint-placeholder-count="2">
        <button sc-camel-on-click="{{ m.pick }}" style="flex: 1; height: 32px; border-radius: 16px; border: none; background: {{ m.bg }}; color: {{ m.fg }}; font-family: inherit; font-size: 13px; font-weight: 650">{{ m.label }}</button>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 17px; font-weight: 650; line-height: 1.25">{{ cur.q }}</span>
      <span style="font-size: 14px; color: #D4F64A">{{ cur.a }}</span>
    </div>
    <svg width="318" height="110" sc-camel-view-box="0 0 318 110" style="display: block; overflow: visible">
      <line x1="0" y1="10" x2="318" y2="10" stroke="#2E3036" stroke-dasharray="3 4"></line>
      <line x1="0" y1="55" x2="318" y2="55" stroke="#2E3036" stroke-dasharray="3 4"></line>
      <line x1="0" y1="100" x2="318" y2="100" stroke="#2E3036" stroke-dasharray="3 4"></line>
      <polyline points="{{ cur.p2 }}" fill="none" stroke="#9A9DA5" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"></polyline>
      <polyline points="{{ cur.p1 }}" fill="none" stroke="#D4F64A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
    </svg>
    <div style="display: flex; gap: 16px; font-size: 12px; color: #9A9DA5">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 3px; border-radius: 2px; background: #D4F64A"></span>{{ cur.l1 }}</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 0; border-top: 2px dashed #9A9DA5"></span>{{ cur.l2 }}</span>
    </div>
  </section>

  <!-- Frecuencia -->
  <section style="background: #1C1D21; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 16px; font-weight: 650">¿Cumple lo planificado?</span>
      <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em">94<span style="font-size: 13px; color: #9A9DA5; font-weight: 500">%</span></span>
    </div>
    <div style="position: relative; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 5px; height: 70px; align-items: end">
      <div style="position: absolute; left: 0; right: 0; bottom: 52px; border-top: 1.5px dashed #6A6D74"></div>
      <sc-for list="{{ weeks }}" as="w" hint-placeholder-count="12"><div style="height: {{ w.h }}; border-radius: 6px; background: {{ w.bg }}"></div></sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #9A9DA5"><span>12 semanas</span><span>Objetivo: 4 por semana</span></div>
  </section>

  <!-- Récords -->
  <section style="background: #1C1D21; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 16px; font-weight: 650">Fuerza · mejores marcas</span>
    <sc-for list="{{ prs }}" as="p" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; font-size: 14px">
        <span>{{ p.ex }}</span>
        <span style="color: #9A9DA5; font-variant-numeric: tabular-nums">{{ p.from }} → <span style="color: #F2F2EE; font-weight: 650">{{ p.to }}</span></span>
        <span style="height: 24px; padding: 0 8px; border-radius: 12px; background: rgba(212,246,74,0.14); color: #D4F64A; font-size: 12px; font-weight: 650; display: flex; align-items: center">{{ p.d }}</span>
      </div>
    </sc-for>
  </section>

  <!-- Fotos -->
  <section style="background: #1C1D21; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between"><span style="font-size: 16px; font-weight: 650">Fotos</span><a href="#" style="font-size: 13px; text-decoration: none">Cambiar fechas</a></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="height: 150px; border-radius: 16px; background: repeating-linear-gradient(135deg, #26282D 0 10px, #222429 10px 20px); display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; font-size: 12px; font-weight: 600">Inicio · 6 jul</div>
      <div style="height: 150px; border-radius: 16px; background: repeating-linear-gradient(135deg, #26282D 0 10px, #222429 10px 20px); display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; font-size: 12px; font-weight: 600">Actual · 2 oct</div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.m) || 0;
const line = (v) => { const mn = Math.min.apply(null, v), mx = Math.max.apply(null, v); return v.map((y, i) => Math.round(i / (v.length - 1) * 318) + ',' + Math.round(10 + (mx - y) / ((mx - mn) || 1) * 90)).join(' '); };
const modes = [
{ label: 'Peso vs fuerza', q: '¿Gana fuerza mientras baja de peso?', a: 'Sí: −1,4 kg corporales y +12 kg en sentadilla', l1: 'Sentadilla (kg)', l2: 'Peso corporal (kg)', p1: line([100, 100, 102.5, 102.5, 105, 105, 107.5, 107.5, 110, 110, 112, 112]), p2: line([79.8, 79.6, 79.7, 79.3, 79.2, 79.0, 78.9, 78.8, 78.7, 78.5, 78.5, 78.4]) },
{ label: 'Frecuencia vs progreso', q: '¿Progresa más cuando entrena más?', a: 'Sí: las semanas de 4+ sesiones suman el 80% de la mejora', l1: 'Carga total semanal', l2: 'Sesiones por semana', p1: line([8.2, 8.4, 9.1, 9.0, 9.6, 9.5, 10.2, 10.4, 10.3, 10.9, 11.2, 11.4]), p2: line([3, 3, 4, 3, 4, 4, 5, 4, 3, 4, 5, 4]) }
];
const wk = [3, 4, 4, 3, 4, 4, 5, 4, 4, 4, 5, 4];
return {
modes: modes.map((m, i) => ({ label: m.label, bg: i === sel ? '#D4F64A' : 'transparent', fg: i === sel ? '#111214' : '#9A9DA5', pick: () => this.setState({ m: i }) })),
cur: modes[sel],
weeks: wk.map((n) => ({ h: Math.round(n / 5.4 * 100) + '%', bg: n >= 4 ? '#D4F64A' : '#4A4D54' })),
prs: [
{ ex: 'Sentadilla', from: '100', to: '112 kg', d: '+12%' },
{ ex: 'Peso muerto', from: '130', to: '142,5 kg', d: '+10%' },
{ ex: 'Press banca', from: '80', to: '85 kg', d: '+6%' }
]
};
}
}
</script>


</body></html>
