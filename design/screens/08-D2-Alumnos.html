<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<title>D2 — Alumnos</title>
<script src="fc007150-5f83-46de-bb3f-ade72e192a14"></script>
</head>
<body>
<x-dc>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #111214; color: #F2F2EE; font-family: 'Geist', 'Helvetica Neue', sans-serif; padding: 58px 16px 0; display: flex; flex-direction: column; gap: 14px">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
    <div style="display: flex; align-items: baseline; gap: 8px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.03em">Alumnos</h1>
      <span style="font-size: 15px; color: #9A9DA5">24 activos</span>
    </div>
    <button aria-label="Agregar alumno" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #D4F64A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#111214" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
  </header>

  <div style="display: flex; gap: 8px">
    <label style="flex: 1; height: 48px; border-radius: 24px; background: #1C1D21; display: flex; align-items: center; gap: 10px; padding: 0 16px">
      <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#9A9DA5" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input placeholder="Buscar por nombre u objetivo" aria-label="Buscar alumno" style="flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #F2F2EE; font-family: inherit; font-size: 15px">
    </label>
    <button aria-label="Filtros" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: #1C1D21; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#F2F2EE" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
  </div>

  <div style="display: flex; gap: 8px; overflow: hidden">
    <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
      <button sc-camel-on-click="{{ f.pick }}" style="height: 38px; padding: 0 14px; border-radius: 19px; border: {{ f.border }}; background: {{ f.bg }}; color: {{ f.fg }}; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0">{{ f.label }} <span style="opacity: 0.7; font-weight: 500">{{ f.n }}</span></button>
    </sc-for>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px; font-size: 13px; color: #9A9DA5">
    <span>Ordenado por: <span style="color: #F2F2EE; font-weight: 600">necesita atención</span></span>
    <span>Últimos 14 días</span>
  </div>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
      <a href="D3_Perfil.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 22px; background: #1C1D21; text-decoration: none; color: #F2F2EE">
        <div style="width: 46px; height: 46px; border-radius: 50%; border: 2px solid {{ r.ring }}; box-sizing: border-box; padding: 2px; flex-shrink: 0">
          <div style="width: 100%; height: 100%; border-radius: 50%; background: #3A3C42; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">{{ r.ini }}</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0">
          <div style="display: flex; justify-content: space-between; gap: 8px">
            <span style="font-size: 15px; font-weight: 600">{{ r.name }}</span>
            <span style="font-size: 13px; color: {{ r.lastFg }}">{{ r.last }}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="font-size: 12px; color: #9A9DA5; width: 92px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.goal }}</span>
            <div style="flex: 1; display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 2px; height: 10px">
              <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="14"><div style="border-radius: 2px; background: {{ c.bg }}"></div></sc-for>
            </div>
          </div>
        </div>
        <span style="height: 28px; min-width: 50px; padding: 0 8px; box-sizing: border-box; border-radius: 14px; background: {{ r.chipBg }}; color: {{ r.chipFg }}; font-size: 13px; font-weight: 650; display: flex; align-items: center; justify-content: center">{{ r.trend }}</span>
      </a>
    </sc-for>
  </section>

  <nav style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 68px; border-radius: 34px; background: #1C1D21; box-shadow: 0 -20px 40px rgba(17,18,20,0.9); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 6px">
    <a href="D1_Inicio.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #9A9DA5; font-size: 10px; font-weight: 600"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 11l8-6 8 6v9H4z"></path></svg>Hoy</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #D4F64A; font-size: 10px; font-weight: 600"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.8c2 .7 3.2 2.5 3.6 5.2"></path></svg>Alumnos</a>
    <div style="display: flex; justify-content: center"><button aria-label="Crear" style="width: 54px; height: 54px; border-radius: 50%; border: none; background: #D4F64A; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="#111214" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button></div>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #9A9DA5; font-size: 10px; font-weight: 600"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"></path></svg>Rutinas</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #9A9DA5; font-size: 10px; font-weight: 600"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Agenda</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.f) || 'todos';
const lime = '#D4F64A', coral = '#FF8F6B', mute = '#9A9DA5';
const cells = (s) => s.split('').map((ch) => ({ bg: ch === '1' ? lime : '#2E3036' }));
const warnChip = { chipBg: 'rgba(255,143,107,0.16)', chipFg: coral };
const upChip = { chipBg: 'rgba(212,246,74,0.14)', chipFg: lime };
const flatChip = { chipBg: '#26282D', chipFg: mute };
const all = [
Object.assign({ k: 'revisar', ini: 'MR', name: 'Martín Ruiz', goal: 'Recomposición', last: 'hace 8 d', lastFg: coral, ring: coral, trend: '—', cells: cells('11011010000000') }, flatChip),
Object.assign({ k: 'revisar', ini: 'SM', name: 'Sofía Méndez', goal: 'Bajar grasa', last: 'ayer', lastFg: mute, ring: coral, trend: '±0', cells: cells('10110110110101') }, warnChip),
Object.assign({ k: 'revisar', ini: 'LP', name: 'Lucía Pereyra', goal: 'Salud general', last: 'hace 3 d', lastFg: mute, ring: coral, trend: '4→2', cells: cells('10100100010000') }, warnChip),
Object.assign({ k: 'progresan', ini: 'LF', name: 'Lucas Ferreyra', goal: 'Fuerza', last: 'hoy', lastFg: lime, ring: lime, trend: '+12%', cells: cells('01101011010111') }, upChip),
Object.assign({ k: 'progresan', ini: 'VR', name: 'Valentina Ríos', goal: 'Hipertrofia', last: 'hoy', lastFg: lime, ring: lime, trend: '+8%', cells: cells('11011011011011') }, upChip),
Object.assign({ k: 'progresan', ini: 'JD', name: 'Joaquín Díaz', goal: 'Rehab rodilla', last: 'hace 2 d', lastFg: mute, ring: lime, trend: '+6%', cells: cells('10010010010010') }, upChip),
Object.assign({ k: 'progresan', ini: 'PA', name: 'Pedro Alonso', goal: 'Hipertrofia', last: 'ayer', lastFg: mute, ring: lime, trend: '+4%', cells: cells('10101101010110') }, upChip),
Object.assign({ k: 'inactivos', ini: 'NB', name: 'Nicolás Bravo', goal: 'Running 10K', last: 'hace 15 d', lastFg: coral, ring: '#4A4D54', trend: '—', cells: cells('00000000000000') }, flatChip)
];
const defs = [
{ id: 'todos', label: 'Todos', n: '24' },
{ id: 'revisar', label: 'Revisar', n: '3' },
{ id: 'progresan', label: 'Progresan', n: '14' },
{ id: 'inactivos', label: 'Inactivos', n: '2' }
];
return {
filters: defs.map((d) => ({
label: d.label, n: d.n,
bg: d.id === sel ? '#F2F2EE' : 'transparent',
fg: d.id === sel ? '#111214' : '#F2F2EE',
border: d.id === sel ? 'none' : '1px solid #3A3C42',
pick: () => this.setState({ f: d.id })
})),
rows: (sel === 'todos' ? all : all.filter((r) => r.k === sel)).slice(0, 7)
};
}
}
</script>


</body></html>
