<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<title>E2 — Alumno · Entrenando</title>
<script src="b3f50b73-5624-4f4d-ae19-b818761df2d9"></script>
</head>
<body>
<x-dc>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #111214; color: #F2F2EE; font-family: 'Geist', 'Helvetica Neue', sans-serif; padding: 58px 16px 0; display: flex; flex-direction: column; gap: 12px">

  <header style="display: flex; align-items: center; gap: 12px">
    <a href="E1_Hoy.dc.html" aria-label="Salir del entrenamiento" style="width: 44px; height: 44px; border-radius: 50%; background: #1C1D21; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="#F2F2EE" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <div style="display: flex; flex-direction: column; flex: 1">
      <span style="font-size: 13px; color: #9A9DA5">Tren inferior · ejercicio 2 de 6</span>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; height: 5px; margin-top: 6px">
        <div style="border-radius: 3px; background: #D4F64A"></div><div style="border-radius: 3px; background: #F2F2EE"></div><div style="border-radius: 3px; background: #2E3036"></div><div style="border-radius: 3px; background: #2E3036"></div><div style="border-radius: 3px; background: #2E3036"></div><div style="border-radius: 3px; background: #2E3036"></div>
      </div>
    </div>
    <span style="font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums">18:42</span>
  </header>

  <div style="height: 188px; border-radius: 26px; background: repeating-linear-gradient(135deg, #1F2125 0 12px, #1A1C1F 12px 24px); position: relative; display: flex; align-items: center; justify-content: center">
    <span style="width: 52px; height: 52px; border-radius: 50%; background: #D4F64A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="#111214"><path d="M7 4l13 8-13 8z"></path></svg></span>
    <span style="position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: #C9CBD0; font-weight: 600">Video de técnica · 0:40</span>
  </div>

  <section style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.03em">Sentadilla trasera</h1>
    <span style="font-size: 14px; color: #D4F64A; line-height: 1.4">Valen: bajá en 3 segundos y pausá abajo. Hoy no vayas al fallo.</span>
  </section>

  <section style="background: #1C1D21; border-radius: 24px; padding: 8px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: grid; grid-template-columns: 54px minmax(0, 1fr) 68px 58px 44px; gap: 6px; padding: 6px 8px; font-size: 12px; color: #9A9DA5; font-weight: 600">
      <span>Serie</span><span>Objetivo</span><span>Kg</span><span>Reps</span><span></span>
    </div>
    <sc-for list="{{ sets }}" as="s" hint-placeholder-count="4">
      <div style="display: grid; grid-template-columns: 54px minmax(0, 1fr) 68px 58px 44px; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 16px; background: {{ s.rowBg }}">
        <span style="font-size: 15px; font-weight: 650">{{ s.n }}</span>
        <span style="font-size: 13px; color: #9A9DA5">{{ s.target }}</span>
        <label style="height: 40px; border-radius: 12px; background: #26282D; display: flex; align-items: center; justify-content: center"><input aria-label="Kilos serie {{ s.n }}" sc-camel-default-value="{{ s.kg }}" style="width: 100%; background: transparent; border: none; outline: none; color: #F2F2EE; font-family: inherit; font-size: 15px; font-weight: 650; text-align: center"></label>
        <label style="height: 40px; border-radius: 12px; background: #26282D; display: flex; align-items: center; justify-content: center"><input aria-label="Repeticiones serie {{ s.n }}" sc-camel-default-value="{{ s.reps }}" style="width: 100%; background: transparent; border: none; outline: none; color: #F2F2EE; font-family: inherit; font-size: 15px; font-weight: 650; text-align: center"></label>
        <button sc-camel-on-click="{{ s.toggle }}" aria-label="Marcar serie {{ s.n }}" style="width: 44px; height: 44px; border-radius: 50%; border: {{ s.border }}; background: {{ s.bg }}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{ s.check }}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"></path></svg></button>
      </div>
    </sc-for>
  </section>

  <sc-if value="{{ resting }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 20px; background: rgba(212,246,74,0.12); color: #D4F64A">
      <span style="font-size: 14px; font-weight: 650">Descanso</span>
      <span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">1:45</span>
    </div>
  </sc-if>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; gap: 8px">
    <a href="#" style="width: 56px; height: 56px; border-radius: 50%; background: #1C1D21; display: flex; align-items: center; justify-content: center" aria-label="Ejercicio anterior"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#F2F2EE" stroke-width="2.2"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <a href="#" style="flex: 1; height: 56px; border-radius: 28px; background: #D4F64A; color: #111214; text-decoration: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">Siguiente: Peso muerto rumano</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() {
const done = (this.state && this.state.done) || [true, true, false, false];
const kg = ['105', '105', '105', '105'];
const reps = ['5', '5', '', ''];
return {
resting: done.some(Boolean) && !done.every(Boolean),
sets: done.map((d, i) => ({
n: String(i + 1),
target: '5 × 105 kg',
kg: kg[i], reps: d ? (reps[i] || '5') : reps[i],
rowBg: d ? 'rgba(212,246,74,0.06)' : 'transparent',
bg: d ? '#D4F64A' : 'transparent',
border: d ? 'none' : '1.5px solid #4A4D54',
check: d ? '#111214' : '#4A4D54',
toggle: () => { const nx = done.slice(); nx[i] = !nx[i]; this.setState({ done: nx }); }
}))
};
}
}
</script>


</body></html>
