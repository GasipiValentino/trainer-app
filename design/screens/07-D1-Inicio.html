<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<title>D1 — Inicio</title>
<script src="4d78a891-3ff9-427a-87aa-d1b49ca14191"></script>
</head>
<body>
<x-dc>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #111214; color: #F2F2EE; font-family: 'Geist', 'Helvetica Neue', sans-serif; padding: 58px 16px 0; display: flex; flex-direction: column; gap: 12px">

  <!-- Saludo -->
  <header style="display: flex; align-items: center; gap: 12px; padding: 0 4px 6px">
    <div style="width: 46px; height: 46px; border-radius: 50%; background: #D4F64A; color: #111214; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px">VG</div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
      <span style="font-size: 20px; font-weight: 650; letter-spacing: -0.01em">Buen día, Valen</span>
      <span style="font-size: 13px; color: #9A9DA5">Martes 6 de octubre · 5 sesiones hoy</span>
    </div>
    <button aria-label="Mensajes, 3 sin leer" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #1C1D21; position: relative; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#F2F2EE" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg><span style="position: absolute; top: 9px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #D4F64A"></span></button>
  </header>

  <!-- Atención -->
  <section style="background: #D4F64A; color: #111214; border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; font-weight: 600">Atención hoy</span>
        <span style="font-size: 30px; line-height: 1.05; font-weight: 700; letter-spacing: -0.03em">3 alumnos<br>necesitan tu mirada</span>
      </div>
      <div style="display: flex">
        <div style="width: 34px; height: 34px; border-radius: 50%; background: #111214; color: #F2F2EE; border: 2px solid #D4F64A; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">MR</div>
        <div style="width: 34px; height: 34px; border-radius: 50%; background: #3A3C42; color: #F2F2EE; border: 2px solid #D4F64A; margin-left: -10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">SM</div>
        <div style="width: 34px; height: 34px; border-radius: 50%; background: #5A5D64; color: #F2F2EE; border: 2px solid #D4F64A; margin-left: -10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">LP</div>
      </div>
    </div>
    <a href="#" style="height: 50px; border-radius: 25px; background: #111214; color: #D4F64A; text-decoration: none; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px; font-size: 15px; font-weight: 600">Revisar uno por uno <span style="width: 36px; height: 36px; border-radius: 50%; background: #D4F64A; color: #111214; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
  </section>

  <!-- Semana -->
  <section style="background: #1C1D21; border-radius: 24px; padding: 18px 20px; display: flex; gap: 18px; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 112px">
      <span style="font-size: 13px; color: #9A9DA5">Entrenos semana</span>
      <span style="font-size: 32px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">31<span style="font-size: 16px; color: #9A9DA5; font-weight: 500">/38</span></span>
      <span style="font-size: 12px; color: #D4F64A">24 alumnos activos</span>
    </div>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end">
      <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <div style="width: 100%; height: 64px; display: flex; align-items: flex-end">
            <div style="width: 100%; height: {{ d.h }}; border-radius: 8px; background: {{ d.bg }}; border: {{ d.border }}; box-sizing: border-box"></div>
          </div>
          <span style="font-size: 11px; color: {{ d.fg }}; font-weight: 600">{{ d.l }}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- Lista -->
  <section style="background: #1C1D21; border-radius: 24px; padding: 6px 8px 8px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 12px 8px">
      <span style="font-size: 17px; font-weight: 650">Novedades</span>
      <a href="#" style="font-size: 13px; text-decoration: none">Ver todo</a>
    </div>
    <sc-for list="{{ feed }}" as="f" hint-placeholder-count="4">
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 18px; background: #26282D; margin-top: 6px; text-decoration: none; color: #F2F2EE">
        <div style="width: 40px; height: 40px; border-radius: 50%; background: #3A3C42; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0">{{ f.ini }}</div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
          <span style="font-size: 15px; font-weight: 600">{{ f.name }}</span>
          <span style="font-size: 13px; color: #9A9DA5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ f.text }}</span>
        </div>
        <span style="height: 28px; padding: 0 10px; border-radius: 14px; background: {{ f.chipBg }}; color: {{ f.chipFg }}; font-size: 13px; font-weight: 650; display: flex; align-items: center; white-space: nowrap">{{ f.chip }}</span>
      </a>
    </sc-for>
  </section>

  <!-- Barra inferior -->
  <nav style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 68px; border-radius: 34px; background: #1C1D21; box-shadow: 0 -20px 40px rgba(17,18,20,0.9); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 6px">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #D4F64A; font-size: 10px; font-weight: 600"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 11l8-6 8 6v9H4z"></path></svg>Hoy</a>
    <a href="D2_Alumnos.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #9A9DA5; font-size: 10px; font-weight: 600"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.8c2 .7 3.2 2.5 3.6 5.2"></path></svg>Alumnos</a>
    <div style="display: flex; justify-content: center"><button aria-label="Crear" style="width: 54px; height: 54px; border-radius: 50%; border: none; background: #D4F64A; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="#111214" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button></div>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #9A9DA5; font-size: 10px; font-weight: 600"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"></path></svg>Rutinas</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #9A9DA5; font-size: 10px; font-weight: 600"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Agenda</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() {
const counts = [6, 5, 7, 6, 4, 3, 0], labels = ['L', 'M', 'M', 'J', 'V', 'S', 'D'], today = 1;
const lime = '#D4F64A', coral = '#FF8F6B';
return {
days: counts.map((n, i) => ({
l: labels[i],
h: Math.max(10, Math.round(n / 8 * 100)) + '%',
bg: i <= today ? lime : 'transparent',
border: i > today ? '1.5px dashed #4A4D54' : 'none',
fg: i === today ? lime : '#9A9DA5'
})),
feed: [
{ ini: 'MR', name: 'Martín Ruiz', text: 'Sin registrar entrenamiento', chip: '8 días', chipBg: 'rgba(255,143,107,0.16)', chipFg: coral },
{ ini: 'SM', name: 'Sofía Méndez', text: 'Peso estable con 92% de cumplimiento', chip: '5 sem', chipBg: 'rgba(255,143,107,0.16)', chipFg: coral },
{ ini: 'LF', name: 'Lucas Ferreyra', text: 'Récord en sentadilla · 112 kg', chip: '+12%', chipBg: lime, chipFg: '#111214' },
{ ini: 'PA', name: 'Pedro Alonso', text: 'Primer mes sin faltar', chip: '16/16', chipBg: lime, chipFg: '#111214' }
]
};
}
}
</script>


</body></html>
