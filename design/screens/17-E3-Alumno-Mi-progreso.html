<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<title>E3 — Alumno · Mi progreso</title>
<script src="4da159e0-f8b5-46e7-bcaa-a08b80c9a3cb"></script>
</head>
<body>
<x-dc>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #111214; color: #F2F2EE; font-family: 'Geist', 'Helvetica Neue', sans-serif; padding: 58px 16px 0; display: flex; flex-direction: column; gap: 12px">

  <header style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 4px">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 13px; color: #9A9DA5">Desde el 18 de agosto</span>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.03em">Mi progreso</h1>
    </div>
    <a href="#" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #3A3C42; color: #F2F2EE; text-decoration: none; font-size: 13px; font-weight: 600; display: flex; align-items: center">Ver reporte</a>
  </header>

  <!-- Destacado -->
  <section style="background: #D4F64A; color: #111214; border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; font-weight: 600">Nuevo récord · jueves 1 oct</span>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Sentadilla</span>
      <span style="font-size: 44px; line-height: 1; font-weight: 750; letter-spacing: -0.04em">112<span style="font-size: 18px; font-weight: 600"> kg</span></span>
    </div>
    <svg width="318" height="56" sc-camel-view-box="0 0 318 56" style="display: block; overflow: visible">
      <polyline points="0,50 29,50 58,45 87,45 116,38 145,38 174,30 203,30 232,20 261,20 290,8 318,8" fill="none" stroke="#111214" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
      <circle cx="318" cy="8" r="5" fill="#111214"></circle>
    </svg>
    <span style="font-size: 14px; font-weight: 600">Empezaste en 100 kg: +12% en 6 semanas</span>
  </section>

  <!-- Números -->
  <section style="background: #1C1D21; border-radius: 24px; padding: 16px 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 12px; color: #9A9DA5">Entrenos</span><span style="font-size: 24px; font-weight: 700; letter-spacing: -0.03em">38</span></div>
    <div style="display: flex; flex-direction: column; gap: 3px; border-left: 1px solid #2E3036; padding-left: 12px"><span style="font-size: 12px; color: #9A9DA5">Constancia</span><span style="font-size: 24px; font-weight: 700; letter-spacing: -0.03em">94<span style="font-size: 13px; color: #9A9DA5; font-weight: 500"> %</span></span></div>
    <div style="display: flex; flex-direction: column; gap: 3px; border-left: 1px solid #2E3036; padding-left: 12px"><span style="font-size: 12px; color: #9A9DA5">Racha</span><span style="font-size: 24px; font-weight: 700; letter-spacing: -0.03em">6<span style="font-size: 13px; color: #9A9DA5; font-weight: 500"> sem</span></span></div>
  </section>

  <!-- Medidas -->
  <section style="background: #1C1D21; border-radius: 24px; padding: 6px 8px 8px; display: flex; flex-direction: column">
    <span style="font-size: 16px; font-weight: 650; padding: 12px 12px 4px">Medidas</span>
    <sc-for list="{{ meas }}" as="m" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: #26282D; margin-top: 6px">
        <span style="font-size: 15px">{{ m.label }}</span>
        <span style="font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums">{{ m.val }}</span>
        <span style="height: 24px; min-width: 52px; box-sizing: border-box; padding: 0 8px; border-radius: 12px; background: rgba(212,246,74,0.14); color: #D4F64A; font-size: 12px; font-weight: 650; display: flex; align-items: center; justify-content: center">{{ m.d }}</span>
      </div>
    </sc-for>
  </section>

  <!-- Logros -->
  <section style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 16px; font-weight: 650; padding: 4px 4px 0">Logros</span>
    <div style="display: flex; gap: 8px; overflow: hidden; margin-right: -16px">
      <sc-for list="{{ badges }}" as="b" hint-placeholder-count="3">
        <div style="flex-shrink: 0; width: 130px; padding: 14px; border-radius: 22px; background: #1C1D21; display: flex; flex-direction: column; gap: 10px">
          <span style="width: 36px; height: 36px; border-radius: 50%; background: {{ b.bg }}; color: {{ b.fg }}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 750">{{ b.ico }}</span>
          <span style="font-size: 14px; font-weight: 600; line-height: 1.25">{{ b.t }}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <nav style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 68px; border-radius: 34px; background: #1C1D21; box-shadow: 0 -20px 40px rgba(17,18,20,0.9); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 6px">
    <a href="E1_Hoy.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #9A9DA5; font-size: 10px; font-weight: 600"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 11l8-6 8 6v9H4z"></path></svg>Hoy</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #9A9DA5; font-size: 10px; font-weight: 600"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"></path></svg>Mi plan</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #D4F64A; font-size: 10px; font-weight: 600"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-6 4 3 7-9"></path></svg>Progreso</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #9A9DA5; font-size: 10px; font-weight: 600"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg>Coach</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() {
return {
meas: [
{ label: 'Peso', val: '78,4 kg', d: '−1,4' },
{ label: 'Cintura', val: '82 cm', d: '−3' },
{ label: 'Grasa corporal', val: '14 %', d: '−2 pts' }
],
badges: [
{ ico: 'PR', t: 'Récord en sentadilla', bg: '#D4F64A', fg: '#111214' },
{ ico: '6', t: '6 semanas sin cortar', bg: '#26282D', fg: '#D4F64A' },
{ ico: '1M', t: 'Primer mes completo', bg: '#26282D', fg: '#D4F64A' }
]
};
}
}
</script>


</body></html>
